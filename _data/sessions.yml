  title: "Introduction to Text Analytics in R"
  themes: []
  id: 2042
  speakers: [202]
  subtype: Workshop
  service:
  hidden: false
  description: "<p>This workshop will introduce methods for computational analysis of text, particularly core approaches from corpus linguistics (keyword analysis) and data science (topic modelling). Using pre-built computational notebooks from LADAL (https://ladal.edu.au/tools.html) we will introduce the steps and decisions needed to conduct a computational analysis of a textual corpus, and discuss how and where these approaches might fit into your research toolkit.</p>

<p>You will learn how to:</p>

<ul>
<li>Run a computational notebook and modify some R code in a web-based environment.</li>
<li>Conduct a keyword analysis and create topic models on a provided textual corpus.</li>
<li>Identify what kind of textual data you need to apply these methods and the key steps in computational approaches to text.</li>
</ul>
<p>Note that this workshop is best taken following the workshop 'Exploring texts using concordances', but can be attended as a standalone. No experience programming in R is necessary.
</p>
"
