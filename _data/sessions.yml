  description: "<p>Have you ever wondered why, thanks to your fast internet at home you can stream movies in UltraHD smoothly, but your data upload is super slow?</p>

<p>Sometimes sharing data with collaborators can be tedious, slow and frustrating.</p>

<p>This workshop addresses some data handling solutions in a research context. The workshop will introduce some research data movement tools, with a hands-on introduction to FileSender and a peek into Globus, a service that enables large-scale data transfers.</p>

<p>By the end of this workshop, you should be able to:</p>
<ul>
<li>Understand various network and connectivity constraints. </li>
<li>Transfer large amounts of data via the network. </li>
<li>Search for more advanced options for data movement and know where to go for help.</li>
</ul>

<p>Come along and learn how to make data transfer easy and convenient for you.</p>
"
