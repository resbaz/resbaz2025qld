  title: "Beyond the Code: Effective Research Automation with Git, Ansible and Docker"
  themes: []
  id: 2039
  speakers: [258]
  subtype: Workshop
  service:
  hidden: false
  description: "<p>This presentation is designed for researchers, postgrads, and academics who manage their own code but may not have a background in system administration. Participants will learn how to use Git, Ansible, and Docker — three powerful tools that can transform the way they manage, automate, and share their research code.  </p>

<p>During the presentation, attendees will be guided step-by-step through using Git for version control, Ansible for automated environment configuration, and Docker for creating consistent, portable execution environments. By the end of the session, participants will understand the fundamentals of git, automating system setups, and how to run their code in reproducible containers. </p>

<p>Topics Covered:</p>
<ul>
<li>What is version control and why do you use it? </li>
<li>Using GitHub for version control and collaboration </li>
<li>What is Ansible and why do you use it? </li>
<li>Creating and running Ansible playbooks </li>
<li>Demonstration: Manually configuring environments vs automated Ansible setups  </li>
<li>Understanding Docker containers and their benefits </li>
<li>Overview of Docker Desktop </li>
<li>How to create and run a docker container that runs your code </li>
<li>Demonstration: Running basic docker containers </li>
<li>Tips for best structuring your Git, Ansible, and Docker setups</li>
</ul>
"
