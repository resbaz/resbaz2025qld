  description: "<p>In this interactive session, you'll explore how to shape a researcher profile that captures more than just your titles, it reflects your journey, your purpose, and what makes your work matter. Think less “template,” more you on the page. We’ll share tips for building authentic profiles across digital platforms so you can take what fits and make it your own.</p>
