  title: "Key Story - These aren't the droids you're looking for: on the ongoing failure to create safe, ethical, and beneficial Artificial Intelligence"
  themes: []
  id: 102
  speakers: [102]
  subtype: talk
  hidden: false
  description: "As artificial intelligence (AI) becomes more advanced and ubiquitous across society, concerns are increasing around the risks associated with different AI technologies. In this presentation I argue that stakeholders are failing to ensure the design of safe, ethical, and beneficial technologies and that we are rapidly moving toward a point of no return. An overview of current and future AI risks is presented, following which the critical role of Human Factors (HF) in the design of safe, ethical, and beneficial AI is articulated. Case studies are used to demonstrate these arguments, showing where risks emerge and where HF input is required. To close, the SECURE (Safe, Ethical, Controllable, Usable, Responsible, and Effective) AI Human Factors Integration lifecycle is presented to demonstrate what Human Factors input is required at different lifecycle stages, and what controls are needed to manage AI safety risks."
