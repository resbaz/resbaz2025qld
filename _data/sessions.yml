  description: "This workshop offers an introduction to Artificial intelligence (AI) methods and Machine Learning concepts, focusing on both Supervised and Unsupervised approaches. Participants will use R to explore techniques such as clustering and Random Forest, gaining experience with realistic data, that can be adapted to their field or study. Designed for beginners with basic R knowledge, the session will build foundational skills in applying AI to data analysis. No prior experience in machine learning is required, making this a practical and accessible entry point into modern AI methods."
