  title: "BoF: Charting a path towards a sustainable community of people who work on Research Software"
  themes: []
  id: 2027
  speakers: [228]
  subtype: Workshop
  service:
  hidden: false
  description: "<p>Please join us to raise awareness across Queensland of the community of people who work on Research Software, the Research Software Engineer Australia New Zealand (RSE-AUNZ) community, and to understand the needs of the community.</p>
  <p>This BoF would be of interest to people who:</p>
  <ul>
  <li>Develop research software and are worried about career progression,</li>
  <li>Want to make the research software more visible,</li>
  <li>Streamline and scale research workflows but feel undervalued,</li>
  <li>Balance researcher needs with good software practices, and</li>
  <li>Make research software easier to use.</li>
  </ul>
  <p>It would also be useful to those who manage RSEs or who struggle to recruit or maintain RSEs within their project lifecycles, and those who would like to help sustain this community.</p>
  <p>Objectives would be to solicit feedback and discussion about the following topics :</p>
  <ul>
  <li>What are the needs of the community and is the RSE-AUNZ meeting those needs?</li>
  <li>What can we do to get more active community participation? Eg. proactively sharing knowledge, joining the steering committee, or asking for help?</li>
  <li>How can we ensure greater equity and inclusion within the RSE-AUNZ community to better support and represent all members?</li></ul>"
