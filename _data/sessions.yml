  description: "<p>This workshop introduces the Australian Internet Observatory (AIO). Focusing on data donation approaches and the AIO dashboard, it will showcase how researchers of all skill levels can collect and study data using these tools. We will explore what topics can be investigated, what insights can be gained, and how the AIO can complement or expand existing research methodologies.</p>

