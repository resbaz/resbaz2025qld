  title: Maximising Health Research Outcomes with Secondary Clinical Trial Data
  themes: []
  id: 2013
  speakers: [245]
  subtype: Workshop
  service:
  hidden: false
  description: "
<p>Clinical data sharing in health and medical research offers significant potential to uncover new discoveries and increase efficiency in the research process, which will overall improve patient outcomes. To support this, the Australian Research Data Commons (ARDC) has built national research infrastructure to enhance the discoverability, access, and reuse of data from health research studies across Australia. </p>

<p>In this workshop, participants will learn how to discover and request clinical trials data using one of ARDC’s key national platforms: Health Data Australia (HDA). The HDA platform is a national catalogue designed to connect researchers with valuable Australian health datasets (researchdata.edu.au/health/).</p>

<p>This workshop will also introduce a practical framework for the secondary use of clinical trials data, developed in collaboration with the Health Studies Australian National Data Asset (HeSANDA) and researchers from the NextGen Evidence Synthesis Team at the NHMRC Clinical Trials Centre, University of Sydney. The development of the practical framework for the secondary use of clinical trials data was also informed by research literature, stakeholder consultations, and expert guidance.</p>

<p>This workshop is designed for researchers, data scientists, and health professionals interested in leveraging secondary clinical trials data for new research. By the end of this workshop, participants will be able to:</p>

<ul>
<li>Use the Health Data Australia platform to discover and request access to clinical trials data.</li>
<li>Describe the four domains of data reuse outlined in the Secondary Use Framework and supporting User Guides. These domains are detailed in 'Secondary use of clinical trials data in health research: A Practical Guide' (Hunter et al. 2024). </li>
<li>Evaluate the benefits, challenges, and ethical considerations associated with using secondary health data.</li>
<li>Reflect on opportunities to incorporate secondary clinical trial data into their own research practices.</li>
</ul>
" 
