  title: "Valuing What Matters: A Participatory Framework for Recognising Diverse Contributions"
  themes: []
  id: 2018
  speakers: [246]
  subtype: Workshop
  service:
  hidden: false
  description: "<p>This workshop introduces Metavaluation, an open-source framework for recognising and rewarding diverse research contributions—from data sharing and teaching to mentoring, organising, and behind-the-scenes work that often goes unseen.</p>

<p>Its key innovation lies in treating peer evaluations as valuable contributions themselves—using a self-referential process that pegs all other valuations to these reviews as a ‘base unit’ of value. This creates a dynamic feedback loop that directly rewards participation while generating transparent, relative value scores across all contributions.</p>

<p>In the first part of the workshop, we’ll explore the development of Metavaluation—from its origins as a radically transparent peer-review model aimed at accelerating Open Science, to its evolution through participatory festivals into a general-purpose framework for community-led evaluation. We’ll share pilot data from commons-oriented communities across science, arts, technology, and environmental sectors—demonstrating how the system flexibly recognises what matters to different communities, while also creating pathways for coordination between them.</p>

<p>In the second part, we’ll use ResBaz Queensland 2025 as a live case study. Participants will nominate and evaluate real contributions to the event—such as talks, mentorship, organising, or community support—via a simple, inclusive peer-review process. Together, we’ll generate a live dataset that maps what this community values most, and explore how this data can support recognition, guide future events, and connect aligned communities across domains.</p>

<p>You’ll leave with:</p>

<ul>
<li>An understanding of key obstacles to the Open Science movement—and how Metavaluation addresses them</li>
<li>Hands-on experience with participatory valuation</li>
<li>A live dataset visualising ResBaz contributions and community values</li>
<li>Tools to empower your own research group or community</li>
<li>An invitation to join a participatory festival later in the year, organised through Metavaluation</li>
<li>Recognition for your workshop contributions—credited within the Metavaluation system itself</li>
</ul>
"
