  title: "Automating Research Data Workflows with Microsoft Forms and Power BI"
  themes: []
  id: 2035
  speakers: [255,256]
  subtype: Workshop
  service:
  hidden: false
  description: "<p>This practical workshop is designed for researchers seeking to automate and streamline the entire data lifecycle-from collection to visualisation-using Microsoft Forms and Power BI. </p>
<p>Participants will learn how to:</p>
<ul>
<li>Design effective data collection instruments with Microsoft Forms for research surveys.</li>
<li>Automate data transfer and storage by integrating Forms with Power BI, leveraging tools like Power Automate and SharePoint for seamless, real-time data flow.</li>
<li>Clean and transform raw survey data for analysis using Power BI’s data transformation tools, ensuring data quality and usability for reporting.</li>
<li>Set up scheduled or automated refreshes to keep reports up-to-date without manual intervention, supporting reproducible and scalable research workflows.</li>
<li>Learn from real-world, anonymised case studies and lessons learned by the data team at Griffith University's Relational Insights Data Lab (RIDL), including common pitfalls, best practices, and tips for successful implementation.</li>
</ul>
<p>By the end of this session, attendees will be equipped to automate repetitive data tasks, reduce manual errors, and accelerate the journey from data collection to impactful research insights. No prior experience with Microsoft Forms or Power BI is required.</p>
"
-
  title: "Introduction to data cleaning with OpenRefine"
  themes: []
  id: 2036
  speakers: [201]
  subtype: Workshop
  service:
