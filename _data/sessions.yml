-
  title: Research data and high-performance computing at Pawsey
  themes: []
  id: 2007
  speakers: [211]
  subtype: Workshop
  service:
  hidden: false
  description: "<p>Are you looking to scale up your eResearch workflows to use really big data or compute? Interested in AI but no idea where to start? No worries, I got your back!</p><p>The Pawsey Supercomputing Research Centre is one of two Tier-1 supercomputing facilities in Australia. Pawsey is home to Australia's (and the southern hemisphere's!) most powerful supercomputer, Setonix, but we also provide a range of training, software engineering and research data consulting services to Australian researchers across a wide variety of research domains. We can help get you up and running, or work with you to help optimise your data and compute workflows to make sure you get the most out of your research tools.</p><p>In this talk, I'll provide an overview of Pawsey's high-performance computing and research data systems, as well as how we're working with researchers in Queensland to develop and optimise research software across domains like physics, chemistry, and health and life sciences. I'll also discuss the available schemes to get access to Pawsey's systems and services, and round it out with plenty of time for Q&A.</p>"
-
  title: TERN Services to Enable Research in Ecosystem Science
  themes: []
  id: 2008
  speakers: [239]
  subtype: Workshop
  service:
  hidden: false
  description: "<p>Discover how TERN’s national-scale infrastructure supports cutting-edge ecosystem research. This workshop introduces TERN’s open-access data, tools, and services, which help researchers monitor and understand Australia’s diverse environments. Through case studies and interactive demonstrations, participants will learn how to access and apply TERN resources to advance their work in ecosystem science, environmental management, and beyond. The workshop is ideal for researchers, students, environmental managers, and policymakers interested in advancing their understanding of Australian ecosystems through robust, open-access infrastructure.</p><p>Whether new to TERN or looking to deepen your engagement, this session will equip you with the knowledge and tools to harness TERN’s capabilities to support impactful ecosystem science.</p>"
-
  title: Why you need an ORCID
