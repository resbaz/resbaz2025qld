  title: "EcoCommons: Calculating and visualising Species Richness and Shannon Diversity for analysing ecological surveys with EcoCommons Notebooks"
  themes: []
  id: 2005
  speakers: [237]
  subtype: Workshop
  service:
  hidden: false
  description: "<p>EcoCommons Australia hosts a variety of Advanced Ecological Modelling Notebooks aimed at bridging the gap between platform-based analysis tools and hands-on coding. EcoCommons offers notebooks in both Quarto markdown (.qmd) and Jupyter Notebook (.ipynb) formats, making it easier for users to interact with and customise workflows. This workshop will focus on a notebook which guides users through the process of calculating and visualising Species Richness and Shannon diversity indices, which are a commonly used metrics for analysing and conducting statistical comparisons for ecological surveys.</p>
<p>In this workshop we will cover:</p>
<ul>
<li>How to access EcoCommons notebooks</li>
<li>Brief overview of the biodiversity metrics and their potential applications</li>
<li>Running the Species Richness and Shannon diversity notebook</li>
<li>Modification of notebook outputs for different use cases</li>
</ul>
<p>The aim of the workshop is to make participants feel confident to run an EcoCommons notebook and understand the workflow in calculating and visualising Species Richness and Shannon diversity.</p>"
-
  title: "Productive and precise academic writing"
