  title: "Making code go fast: an introduction to performance engineering in research"
  themes: []
  id: 2016
  speakers: [211]
  subtype: Workshop
  service:
  hidden: false
  description: "<p>eResearch workflows increasingly rely on new computing technologies, such as big data analytics, massively-parallel computer simulations, or large-scale AI training workloads. These technologies promises to vastly increase the scale and kind of research that's possible to do... if we can write our code to take full advantage of them. Making use of big compute and big data often requires a shift in thinking around how we structure our code, as inefficient software limits how effectively you can use these computing resources. Plus, time spent waiting for code or data pipelines to complete is time not spent doing research.</p>
  <p>Squeezing every available bit of performance out of your code can be extremely time-consuming, but fortunately, a little bit of know-how can go a long way. This talk will provide an introduction to performance engineering, with a focus on practical techniques for compute- and data-heavy workflows. I will discuss important trends in research computing hardware and software, as well as how the prominence of high-level languages such as Python and R have changed the research computing landscape. Finally, I'll share some methodologies and open-source tools which will help you get the most 'bang for your buck' when optimising slow code in your research pipelines.</p>"
-
  title: Building a Species Distribution Model with EcoCommons Platform
  themes: []
  id: 2017
  speakers: [230]
  subtype: Workshop
  service:
  hidden: false
  description: "<p>EcoCommons Australia offers a comprehensive suite of resources for ecological modelling, including an intuitive, user-friendly platform featuring thousands of trusted datasets and a range of expert-developed workflows for species distribution and community modelling.</p>

<p>This workshop will begin with a brief introduction to species distribution models (SDMs), followed by a guided tour of the EcoCommons platform. We will cover:</p>

<ul>
<li>How to access and acquire biodiversity records from open data portals,
<li>An introduction to EcoCommons’ 59,000 curated environmental datasets,
<li>Building SDMs using a selection of 19 available algorithms, and
<li>Exploring and interpreting model outputs.</li>
</ul>

<p>By the end of the workshop, attendees will understand how to run effective SDMs, select fit-for-purpose data, and produce accurate and meaningful results — all within a point-and-click environment.</p>
"
-
  title: "Valuing What Matters: A Participatory Framework for Recognising Diverse Contributions"
  themes: []
  id: 2018
  speakers: [246]
  subtype: Workshop
  service:
  hidden: false
  description: "<p>This workshop introduces Metavaluation, an open-source framework for recognising and rewarding diverse research contributions—from data sharing and teaching to mentoring, organising, and behind-the-scenes work that often goes unseen.</p>

<p>Its key innovation lies in treating peer evaluations as valuable contributions themselves—using a self-referential process that pegs all other valuations to these reviews as a ‘base unit’ of value. This creates a dynamic feedback loop that directly rewards participation while generating transparent, relative value scores across all contributions.</p>

<p>In the first part of the workshop, we’ll explore the development of Metavaluation—from its origins as a radically transparent peer-review model aimed at accelerating Open Science, to its evolution through participatory festivals into a general-purpose framework for community-led evaluation. We’ll share pilot data from commons-oriented communities across science, arts, technology, and environmental sectors—demonstrating how the system flexibly recognises what matters to different communities, while also creating pathways for coordination between them.</p>

<p>In the second part, we’ll use ResBaz Queensland 2025 as a live case study. Participants will nominate and evaluate real contributions to the event—such as talks, mentorship, organising, or community support—via a simple, inclusive peer-review process. Together, we’ll generate a live dataset that maps what this community values most, and explore how this data can support recognition, guide future events, and connect aligned communities across domains.</p>

<p>You’ll leave with:</p>

<ul>
<li>An understanding of key obstacles to the Open Science movement—and how Metavaluation addresses them</li>
<li>Hands-on experience with participatory valuation</li>
<li>A live dataset visualising ResBaz contributions and community values</li>
<li>Tools to empower your own research group or community</li>
<li>An invitation to join a participatory festival later in the year, organised through Metavaluation</li>
<li>Recognition for your workshop contributions—credited within the Metavaluation system itself</li>
</ul>
"
