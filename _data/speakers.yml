  bio: "Ryan has a diverse range of research experience (lab, field, data analysis) within the environmental sciences, ranging from environmental and ecological monitoring (water, soil, plants, animals) to chemical, landscape and molecular ecology. Ryan played a key role in pollination ecology research at Griffith University, focused on using field and molecular techniques to investigate the impacts of bee and insect pollination on horticultural crop yield, quality, nutrition and paternity. His own PhD studies focused on exploring the impacts of stingless beehive propagation, and tree resin (e.g. Eucalyptus) foraging behaviour using molecular techniques such as DNA metabarcoding. 

At QCIF, Ryan is a Data Scientist and R Developer within the EcoCommons and Sustainable Futures team."
