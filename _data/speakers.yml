  bio: "Dr Cooper Smout is a neuroscientist, designer, and open science advocate working at the intersection of collective sensemaking, participatory governance, and systemic reform. He founded Free Our Knowledge, a collective action platform for academic reform, and Open Heart + Mind (OHM), a charitable organisation developing open-source tools to empower diverse communities. His current work centres on Metavaluation — a protocol for participatory evaluation that generates transparent, interoperable value metrics to support fair recognition and reward, decentralised coordination, and collective governance across research and commons-oriented ecosystems."
