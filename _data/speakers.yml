  id: 247
  name: Prof. Robert
  surname: Harvey
  pronouns: 
  company: UniSC
  title: Associate Dean, Research
  bio: "Professor Harvey obtained his PhD in Natural Sciences (Biochemistry) from the University of Cambridge and carried out postdoctoral studies at the Institute for Cell Biology and Clinical Neurobiology in Hamburg and the Max-Planck-Institute for Brain Research in Frankfurt. Prior to his appointment at UniSC, he was Professor of Molecular Neuroscience and Genetics at the UCL School of Pharmacy (London, United Kingdom). At UCL, he was Associate Director for Research, Chair of Research Committee and Research Excellence Framework Impact co-ordinator. Professor Harvey also served on several Departmental and Faculty committees including the Athena Swan Committee, the UCL Open Access Academic Advisory Group and the UCL Faculty of Life Sciences Senior Management group. Prof Harvey relocated to the University of the Sunshine Coast in 2017, where he became Discipline Lead for Biomedical Science (2017-2022). He is currently Professor of Pathophysiology and Associate Dean (Research) for the School of Health (2022-2026). Prof Harvey is a member of the UniSC School of Health Executive and Chairs the UniSC School of Health Research Committee. He is also the Field Chief Editor of the open access journal Frontiers in Molecular Neuroscience. Prof Harvey has served as a peer reviewer for Science in Australia Gender Equity (SAGE), the National Health and Medical Research Council (NHMRC) and as a member of the Australian Research Council (ARC) College of Experts (2021-2024)."
