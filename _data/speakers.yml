  id: 236
  name: Dr Virginie
  surname: Perlo
  pronouns: 
  company: QUT
  title: 
  bio: "<p>Dr Virginie Perlo is a Postdoctoral Research Fellow - Data Science at Queensland University of Technology (QUT). She graduated with a PhD in Bioinformatics and Genetics at the University of Queensland (2021). She also holds two Master’s degrees in Molecular Biology and Genetics (Pierre and Marie Curie University (UPMC), now Sorbonne University) and in Aquatic Productions Management (University of Montpellier).</p><p>Dr Perlo has more than ten years of experience in molecular biology, multi-omics analysis and bioinformatics on big projects. She also has significant experience in public and private informatics sectors, holding diverse roles such as a software engineer, project manager, and business analyst. She has a strong interest in metabolic network modelling, data visualisation, unsupervised machine learning and artificial intelligence (AI). She is currently involved in the Mind and Body performance patch project funded by the Defence Science and Technology (DST). Her role in the project as a data scientist will be to generate a pipeline to combine many datasets (omics, psychological and physiological) to identify stress biomarkers and optimise human performance.</p>"
